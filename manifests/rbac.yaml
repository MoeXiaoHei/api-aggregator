apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-aggregator
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: api-aggregator
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: api-aggregator
subjects:
- kind: ServiceAccount
  name: api-aggregator
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: api-aggregator
  apiGroup: rbac.authorization.k8s.io
